{# Shared macros. Import with: {% from "ui.html" import icon %} #}
{% macro icon(name, cls='icon') -%}
<svg class="{{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'check' %}<path d="M5 12.5l4.2 4.2L19 7"/>
{%- elif name == 'video' %}<rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3"/>
{%- elif name == 'mic' %}<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>
{%- elif name == 'ear' %}<path d="M7 9a5 5 0 0 1 10 0c0 3-2.5 3.6-3 6a3 3 0 0 1-5.6 1.2"/><path d="M10 9.5a2 2 0 0 1 4 0"/>
{%- elif name == 'keyboard' %}<rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>
{%- elif name == 'chat' %}<path d="M4 5h16v11H9l-5 4z"/>
{%- elif name == 'file' %}<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>
{%- elif name == 'route' %}<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.5"/>
{%- elif name == 'mark' %}<path d="M4 20l4-1 10-10-3-3L5 16z"/><path d="M13 7l3 3"/>
{%- elif name == 'key' %}<circle cx="8" cy="14" r="4"/><path d="M11 11l9-9M17 5l2 2M15 7l2 2"/>
{%- elif name == 'lock' %}<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
{%- elif name == 'redo' %}<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>
{%- elif name == 'upload' %}<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v4h16v-4"/>
{%- elif name == 'person' %}<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
{%- endif %}
</svg>
{%- endmacro %}
